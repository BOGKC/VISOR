<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Visor">
  <style>
    .eye{transform-origin:50px 46px;animation:blink 6s ease-in-out infinite}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
    @media (prefers-reduced-motion:reduce){.eye{animation:none}}
  </style>
  <defs><mask id="hl"><rect width="100" height="100" fill="#fff"/><circle cx="52.6" cy="43.4" r="2.3" fill="#000"/></mask></defs>
  <path stroke="currentColor" stroke-width="7" stroke-linejoin="round" d="M50 10 C66 10 79 13 85 18 C87 42 79 71 50 90 C21 71 13 42 15 18 C21 13 34 10 50 10 Z"/>
  <g class="eye">
    <path stroke="currentColor" stroke-width="5" stroke-linejoin="round" d="M29 46 Q50 29 71 46 Q50 63 29 46 Z"/>
    <circle cx="50" cy="46" r="7.5" fill="currentColor" mask="url(#hl)"/>
  </g>
</svg>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/brand/favicon-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Visor · Opening hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#ededed;--muted:#a1a1a1;--faint:#5c5c5c;--line:#1f1f1f;--line2:#2e2e2e;--card:#0a0a0a;
  --sans:"Geist",ui-sans-serif,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.wrap{max-width:480px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;height:56px;border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px}
.brand svg{color:var(--fg);flex:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;font-size:15px;letter-spacing:-.01em}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero{padding:36px 0 24px}
h1{font-weight:500;font-size:34px;line-height:1.05;letter-spacing:-.035em}
.sub{color:var(--muted);font-size:16px;line-height:1.5;margin-top:12px;letter-spacing:-.01em}
.items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.item{padding:20px;border-top:1px solid var(--line);transition:background .3s}
.item:first-child{border-top:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.day{font-size:18px;font-weight:500;letter-spacing:-.02em}
.date{font-family:var(--mono);font-size:12px;color:var(--muted)}
.compare{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px;margin:16px 0 12px}
.compare .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.old{font-family:var(--mono);font-size:15px;color:var(--faint);text-decoration:line-through;text-decoration-color:#7a7a7a}
.arrow{color:var(--faint);font-family:var(--mono);padding-bottom:2px}
.new{font-family:var(--mono);font-size:20px;font-weight:500;letter-spacing:-.02em}
.why{color:var(--muted);font-size:14px;line-height:1.5}
.actions{display:flex;gap:8px;margin-top:16px}
button{font-family:var(--sans);font-size:14px;font-weight:500;height:40px;padding:0 16px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line2);background:transparent;color:var(--fg);transition:all .15s;letter-spacing:-.01em}
button:hover{border-color:#555}
button:active{transform:scale(.98)}
button.primary{background:var(--fg);color:#000;border-color:var(--fg);flex:1}
button.primary:hover{background:#fff}
button.ghost{border-color:transparent;color:var(--muted)}
button:disabled{opacity:.4;pointer-events:none}
.editor{display:none;margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:10px}
.editor.on{display:block}
.times{display:flex;gap:8px;align-items:center}
input[type=time]{flex:1;height:44px;background:#000;border:1px solid var(--line2);border-radius:8px;color:var(--fg);
  font-family:var(--mono);font-size:16px;padding:0 12px;color-scheme:dark}
.toggle{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:14px;color:var(--muted);cursor:pointer}
.toggle input{accent-color:#ededed;width:16px;height:16px}
.state{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  margin-top:16px;color:var(--fg)}
.state.declined{color:var(--faint)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 0 rgba(237,237,237,.6);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(237,237,237,.5)}70%{box-shadow:0 0 0 8px rgba(237,237,237,0)}100%{box-shadow:0 0 0 0 rgba(237,237,237,0)}}
.item.done{background:#050505}
.panel{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--card);animation:rise .5s ease both}
.panel h2{font-size:18px;font-weight:500;letter-spacing:-.02em;margin:8px 0 4px}
.pubs{margin-top:16px;border-top:1px solid var(--line)}
.pub{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;opacity:0;animation:rise .4s ease forwards}
.pub span:last-child{font-family:var(--mono);font-size:12px;color:var(--muted)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,#000 70%,rgba(0,0,0,0));}
.bar .wrap{display:flex}
.bar button{flex:1;height:48px;font-size:15px}
.foot{margin-top:28px;text-align:center}
.err{padding:80px 0;text-align:center;color:var(--muted)}
.skeleton{height:180px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(90deg,#070707,#101010,#070707);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="brand"><svg width="22" height="22" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Visor"> <defs><mask id="hlm1"><rect width="100" height="100" fill="#fff"/><circle cx="52.6" cy="43.4" r="2.3" fill="#000"/></mask></defs> <g stroke="currentColor" stroke-linejoin="round"> <path stroke-width="7" d="M50 10 C66 10 79 13 85 18 C87 42 79 71 50 90 C21 71 13 42 15 18 C21 13 34 10 50 10 Z"/> <path stroke-width="5" d="M29 46 Q50 29 71 46 Q50 63 29 46 Z"/> </g> <circle cx="50" cy="46" r="7.5" fill="currentColor" mask="url(#hlm1)"/> </svg>Visor</div><div class="label" id="lockless">No login</div></header>
  <section class="hero">
    <div class="label" id="biz">&nbsp;</div>
    <h1 id="title" style="margin-top:12px">&nbsp;</h1>
    <p class="sub" id="sub"></p>
  </section>
  <div id="list"><div class="skeleton"></div></div>
  <div id="after"></div>
  <p class="foot label" id="foot"></p>
</div>
<div class="bar" id="bar" style="display:none"><div class="wrap"><button class="primary" id="all"></button></div></div>

<script>
const S = {
  en:{hi:"Hi {name}",sub1:"One holiday may show the wrong hours on Google. Check it and approve in one tap.",
      subN:"{n} holidays may show the wrong hours on Google. Check them and approve in one tap.",
      subAuto:"As you asked, we updated these for you. Change anything that's not right.",
      shows:"Google shows",sug:"We suggest",approve:"Approve",edit:"Edit",no:"No thanks",save:"Save",cancel:"Cancel",
      closedDay:"Closed all day",closed:"Closed",all:"Approve all ({n})",approved:"Approved · publishing",
      edited:"Saved your hours · publishing",declined:"Skipped · we won't ask about this again",auto:"Updated for you",
      live:"Live",liveTitle:"Your new hours are on their way",liveSub:"Here's where customers will see them:",
      standTitle:"Want us to handle holiday hours automatically?",standSub:"We'll update them for you and always tell you what changed. You can switch this off anytime.",
      yes:"Yes, handle it",notNow:"Not now",standOn:"Done. We'll take care of holiday hours from now on.",
      allDone:"All set. Thanks!",foot:"Visor · Fonecta Connect · you always have the final say",lockless:"No login",
      expired:"This link has expired or doesn't exist.",bad:"Check the hours: opening and closing time are both needed."},
  fi:{hi:"Hei {name}",sub1:"Yhden pyhäpäivän aukioloaika voi näkyä Googlessa väärin. Tarkista ja hyväksy yhdellä napautuksella.",
      subN:"{n} pyhäpäivän aukioloajat voivat näkyä Googlessa väärin. Tarkista ja hyväksy yhdellä napautuksella.",
      subAuto:"Kuten sovittiin, päivitimme nämä puolestasi. Muuta, jos jokin ei täsmää.",
      shows:"Google näyttää",sug:"Ehdotus",approve:"Hyväksy",edit:"Muokkaa",no:"Ei kiitos",save:"Tallenna",cancel:"Peruuta",
      closedDay:"Kiinni koko päivän",closed:"Kiinni",all:"Hyväksy kaikki ({n})",approved:"Hyväksytty · julkaistaan",
      edited:"Aikasi tallennettu · julkaistaan",declined:"Ohitettu · emme kysy tästä uudelleen",auto:"Päivitetty puolestasi",
      live:"Julkaistu",liveTitle:"Uudet aukioloajat ovat matkalla",liveSub:"Asiakkaat näkevät ne täällä:",
      standTitle:"Hoidetaanko pyhäpäivien aukioloajat jatkossa automaattisesti?",standSub:"Päivitämme ne puolestasi ja kerromme aina, mitä muuttui. Voit perua tämän milloin vain.",
      yes:"Kyllä, hoitakaa",notNow:"Ei nyt",standOn:"Selvä. Hoidamme pyhäpäivien aukioloajat tästä eteenpäin.",
      allDone:"Valmista. Kiitos!",foot:"Visor · Fonecta Connect · sinulla on aina viimeinen sana",lockless:"Ei kirjautumista",
      expired:"Linkki on vanhentunut tai sitä ei ole.",bad:"Tarkista ajat: sekä avaus- että sulkemisaika tarvitaan."},
  sv:{hi:"Hej {name}",sub1:"En helgdag kan visa fel öppettider på Google. Kolla och godkänn med ett tryck.",
      subN:"{n} helgdagar kan visa fel öppettider på Google. Kolla och godkänn med ett tryck.",
      subAuto:"Som överenskommet uppdaterade vi dessa åt er. Ändra om något inte stämmer.",
      shows:"Google visar",sug:"Vi föreslår",approve:"Godkänn",edit:"Ändra",no:"Nej tack",save:"Spara",cancel:"Avbryt",
      closedDay:"Stängt hela dagen",closed:"Stängt",all:"Godkänn alla ({n})",approved:"Godkänt · publiceras",
      edited:"Era tider sparade · publiceras",declined:"Hoppat över · vi frågar inte igen",auto:"Uppdaterat åt er",
      live:"Live",liveTitle:"Era nya tider är på väg",liveSub:"Här ser kunderna dem:",
      standTitle:"Ska vi sköta helgtiderna automatiskt?",standSub:"Vi uppdaterar dem åt er och berättar alltid vad som ändrats. Ni kan stänga av det när som helst.",
      yes:"Ja, sköt det",notNow:"Inte nu",standOn:"Klart. Vi sköter helgtiderna från och med nu.",
      allDone:"Klart. Tack!",foot:"Visor · Hitta Connect · ni har alltid sista ordet",lockless:"Ingen inloggning",
      expired:"Länken har gått ut eller finns inte.",bad:"Kolla tiderna: både öppnings- och stängningstid behövs."},
  nb:{hi:"Hei {name}",sub1:"En helligdag kan vise feil åpningstider på Google. Sjekk og godkjenn med ett trykk.",
      subN:"{n} helligdager kan vise feil åpningstider på Google. Sjekk og godkjenn med ett trykk.",
      subAuto:"Som avtalt oppdaterte vi disse for dere. Endre hvis noe ikke stemmer.",
      shows:"Google viser",sug:"Vi foreslår",approve:"Godkjenn",edit:"Endre",no:"Nei takk",save:"Lagre",cancel:"Avbryt",
      closedDay:"Stengt hele dagen",closed:"Stengt",all:"Godkjenn alle ({n})",approved:"Godkjent · publiseres",
      edited:"Tidene lagret · publiseres",declined:"Hoppet over · vi spør ikke igjen",auto:"Oppdatert for dere",
      live:"Live",liveTitle:"De nye tidene er på vei",liveSub:"Her ser kundene dem:",
      standTitle:"Skal vi ordne helligdagstidene automatisk?",standSub:"Vi oppdaterer dem for dere og sier alltid fra om hva som endret seg. Dere kan slå det av når som helst.",
      yes:"Ja, ordne det",notNow:"Ikke nå",standOn:"Ferdig. Vi ordner helligdagstidene fra nå av.",
      allDone:"Alt klart. Takk!",foot:"Visor · Connect · dere har alltid siste ord",lockless:"Ingen innlogging",
      expired:"Lenken er utløpt eller finnes ikke.",bad:"Sjekk tidene: både åpnings- og stengetid trengs."}
};
const token = location.pathname.split("/").pop();
const qs = new URLSearchParams(location.search);
let data, t, shownPubs = false;
const $ = id => document.getElementById(id);
const fmt = (s, o) => s.replace(/\{(\w+)\}/g, (_, k) => o[k]);
const hrs = h => h === "closed" ? t.closed : h.split(",").map(iv => iv.replace("-", "–")).join(", ");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function dateLabel(iso){
  const loc = {fi:"fi-FI",sv:"sv-SE",nb:"nb-NO",en:"en-GB"}[data.lang] || "en-GB";
  return new Intl.DateTimeFormat(loc,{weekday:"short",day:"numeric",month:"short"}).format(new Date(iso+"T12:00:00"));
}

function stateHtml(it){
  if(!it.decision) return "";
  const map = {APPROVED:t.approved, EDITED:t.edited, DECLINED:t.declined, AUTO_APPLIED:t.auto};
  return `<div class="state ${it.decision==="DECLINED"?"declined":""}">${it.decision==="DECLINED"?"":'<span class="dot"></span>'}${map[it.decision]}</div>`;
}

function render(){
  $("biz").textContent = `${data.name} · ${data.city}`;
  $("title").textContent = fmt(t.hi, {name: data.name});
  const pending = data.items.filter(i => !i.decision);
  $("sub").textContent = data.kind === "AUTO_APPLIED" ? t.subAuto : (data.items.length === 1 ? t.sub1 : fmt(t.subN, {n: data.items.length}));
  $("foot").textContent = t.foot; $("lockless").textContent = t.lockless;
  $("list").innerHTML = `<div class="items">${data.items.map((it, i) => {
    const showNew = it.final_hours || it.suggested;
    const canAct = !it.decision || it.decision === "AUTO_APPLIED";
    return `<div class="item ${it.decision ? "done" : ""}" id="it${i}">
      <div class="top"><div class="day">${esc(it.day_name)}</div><div class="date">${dateLabel(it.date)}</div></div>
      <div class="compare">
        <div><div class="k">${t.shows}</div><div class="old">${hrs(it.shown)}</div></div>
        <div class="arrow">→</div>
        <div><div class="k">${t.sug}</div><div class="new">${hrs(showNew)}</div></div>
      </div>
      ${it.reason ? `<p class="why">${esc(it.reason)}</p>` : ""}
      ${stateHtml(it)}
      ${canAct ? `<div class="actions">
        ${it.decision ? "" : `<button class="primary" onclick="act(${i},'approve')">${t.approve}</button>`}
        <button onclick="openEdit(${i})">${t.edit}</button>
        ${it.decision ? "" : `<button class="ghost" onclick="act(${i},'decline')">${t.no}</button>`}
      </div>
      <div class="editor" id="ed${i}">
        <div class="times"><input type="time" id="s${i}"><span class="arrow">–</span><input type="time" id="e${i}"></div>
        <label class="toggle"><input type="checkbox" id="c${i}" onchange="closedToggle(${i})">${t.closedDay}</label>
        <div class="actions" style="margin-top:0"><button class="primary" onclick="saveEdit(${i})">${t.save}</button><button class="ghost" onclick="openEdit(${i},false)">${t.cancel}</button></div>
        <p class="why" id="er${i}" style="margin-top:10px;display:none">${t.bad}</p>
      </div>` : ""}
    </div>`;}).join("")}</div>`;
  $("bar").style.display = pending.length > 1 ? "block" : "none";
  $("all").textContent = fmt(t.all, {n: pending.length});
  if(!pending.length && !document.getElementById("liveP") && data.kind !== "AUTO_APPLIED"){
    $("after").insertAdjacentHTML("afterbegin", `<div class="panel" id="doneP"><div class="label">✓</div><h2>${t.allDone}</h2></div>`);
  }
}

function openEdit(i, on = true){
  const ed = $("ed"+i); ed.classList.toggle("on", on); if(!on) return;
  const it = data.items[i], h = it.final_hours || it.suggested;
  const closed = h === "closed";
  $("c"+i).checked = closed;
  if(!closed){ const ivs = h.split(","); $("s"+i).value = ivs[0].split("-")[0]; $("e"+i).value = ivs[ivs.length-1].split("-")[1]; }
  closedToggle(i);
}
function closedToggle(i){ const c = $("c"+i).checked; $("s"+i).disabled = c; $("e"+i).disabled = c; }
function saveEdit(i){
  const closed = $("c"+i).checked, s = $("s"+i).value, e = $("e"+i).value;
  if(!closed && (!s || !e)){ $("er"+i).style.display = "block"; return; }
  act(i, "edit", closed ? "closed" : `${s}-${e}`);
}

async function send(decisions){
  document.querySelectorAll("button").forEach(b => b.disabled = true);
  const r = await fetch(`/api/m/${token}/decide`, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({decisions})});
  const res = await r.json();
  document.querySelectorAll("button").forEach(b => b.disabled = false);
  if(!r.ok){ alertBox(res.detail || "Error"); return; }
  for(const x of res.results){ const it = data.items.find(i => i.date === x.date); it.decision = x.decision; it.final_hours = x.hours; }
  render();
  const live = res.results.find(x => x.visible_on && x.visible_on.length);
  if(live) showLive(live.visible_on);
  if(res.offer_standing_permission) showStanding();
  try{ parent.postMessage({type:"connect-decided", results: res.results, offer: res.offer_standing_permission}, "*"); }catch(e){}
}
function alertBox(msg){ $("after").insertAdjacentHTML("afterbegin", `<div class="panel"><p class="why">${esc(msg)}</p></div>`); }
function act(i, action, hours){ send([{date: data.items[i].date, action, hours}]); }
$("all").onclick = () => send(data.items.filter(i => !i.decision).map(i => ({date: i.date, action: "approve"})));

function showLive(pubs){
  if(shownPubs) return; shownPubs = true;
  $("after").insertAdjacentHTML("beforeend", `<div class="panel" id="liveP">
    <div class="state" style="margin-top:0"><span class="dot"></span>${t.live}</div>
    <h2>${t.liveTitle}</h2><p class="why">${t.liveSub}</p>
    <div class="pubs">${pubs.map((p, k) => `<div class="pub" style="animation-delay:${k*120}ms"><span>${esc(p.publisher)}</span><span>${esc(p.eta)}</span></div>`).join("")}</div></div>`);
}
function showStanding(){
  if(document.getElementById("standP")) return;
  $("after").insertAdjacentHTML("beforeend", `<div class="panel" id="standP">
    <div class="label">Standing permission</div><h2>${t.standTitle}</h2><p class="why">${t.standSub}</p>
    <div class="actions"><button class="primary" id="sy">${t.yes}</button><button class="ghost" id="sn">${t.notNow}</button></div></div>`);
  $("sy").onclick = async () => {
    await fetch(`/api/standing/${data.entity_id}`, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({granted:true})});
    $("standP").innerHTML = `<div class="state" style="margin-top:0"><span class="dot"></span>On</div><h2>${t.standOn}</h2>`;
    try{ parent.postMessage({type:"connect-standing", granted:true}, "*"); }catch(e){}
  };
  $("sn").onclick = () => $("standP").remove();
}

(async () => {
  const r = await fetch(`/api/m/${token}`);
  if(!r.ok){ t = S[qs.get("lang")] || S.en; $("list").innerHTML = `<p class="err">${t.expired}</p>`; $("title").textContent = ""; return; }
  data = await r.json();
  t = S[qs.get("lang") || data.lang] || S.en;
  document.documentElement.lang = data.lang;
  render();
})();
</script>
</body>
</html>
